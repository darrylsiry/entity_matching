name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests scripts
      - name: Tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Format check (prettier)
        run: npm run format:check
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: API type drift check
        # Regenerate the OpenAPI schema + TS types; fail if they differ from the
        # committed files (backend models changed without `npm run gen:api`).
        run: |
          pip install -r backend/requirements.txt
          python backend/scripts/export_openapi.py backend/openapi.json
          cd frontend && npm run gen:api
          git diff --exit-code -- backend/openapi.json frontend/src/api-schema.d.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Generate sample data
        run: python sample_data/generate.py
      - name: Start prod-mode server (backend serving built frontend)
        run: |
          cd backend
          FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist \
            nohup python -m uvicorn app.main:app --port 8100 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && break
            sleep 1
          done
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright e2e
        run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
