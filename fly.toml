# fly.toml app configuration file generated for entity-matching-g4ntza on 2026-07-04T01:55:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'entity-matching-g4ntza'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENTITY_MATCHING_DATA_DIR = '/data'
  FRONTEND_DIST = '/app/static'

[[mounts]]
  source = 'em_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
